name: Check

on:
  push:
    branches-ignore:
      - "release-allocations/**"
      - "release-recoveries/**"
  pull_request:
  workflow_dispatch:
    inputs:
      allocated_mirror:
        description: Exact lowercase allocated mirror commit to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Public source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Configure devenv cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/c18de5253016e6eb97689724327f08e9dd2d4768
      - name: Check public source
        run: ./scripts/check

  check_macos:
    name: macOS compile
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(awk -F '"' '/^rust-version = / { print $2 }' Cargo.toml)
          if [[ ! "$rust_version" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "Could not read a canonical rust-version from Cargo.toml: $rust_version" >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" \
            --profile minimal \
            --target aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$rust_version" >>"$GITHUB_ENV"
      - name: Check macOS compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features \
            --target aarch64-apple-darwin

  verify_release:
    name: Verify managed allocation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - check
      - check_macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      allocated_mirror: ${{ steps.verify.outputs.allocated_mirror }}
      complete: ${{ steps.verify.outputs.complete }}
      execute: ${{ steps.verify.outputs.execute }}
      source_revision: ${{ steps.verify.outputs.source_revision }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Fetch managed release records
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main \
            '+refs/heads/release-allocations/*:refs/heads/release-allocations/*' \
            '+refs/heads/release-recoveries/*:refs/heads/release-recoveries/*'
          git fetch --force --tags origin
      - name: Verify exact allocation and recovery chain
        id: verify
        shell: bash
        env:
          DISPATCHED_ALLOCATION: ${{ inputs.allocated_mirror }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allocated=auto
          event=push
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            allocated=$DISPATCHED_ALLOCATION
            event=recovery
          fi
          ./scripts/verify-release-allocation \
            --repository . \
            --allocated-mirror "$allocated" \
            --workflow-commit "$GITHUB_SHA" \
            --event "$event" \
            --github-repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/verified-allocation" \
            --github-output "$GITHUB_OUTPUT"

  build_release:
    name: Build ${{ matrix.target }}
    if: >-
      needs.verify_release.outputs.execute == 'true' &&
      needs.verify_release.outputs.complete == 'false'
    needs: verify_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out allocated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_release.outputs.allocated_mirror }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Verify allocated checkout
        shell: bash
        env:
          ALLOCATED_MIRROR: ${{ needs.verify_release.outputs.allocated_mirror }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALLOCATED_MIRROR"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(awk -F '"' '/^rust-version = / { print $2 }' Cargo.toml)
          if [[ ! "$rust_version" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "Could not read a canonical rust-version from Cargo.toml: $rust_version" >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" \
            --profile minimal \
            --target "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$rust_version" >>"$GITHUB_ENV"
      - name: Build release binary
        shell: bash
        env:
          SCHERZO_CLOUD_BUILD_IDENTITY: ${{ needs.verify_release.outputs.source_revision }}
          SCHERZO_CLOUD_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Exercise descriptor-bound command cwd
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          SCHERZO_CLOUD_BUILD_IDENTITY: ${{ needs.verify_release.outputs.source_revision }}
          SCHERZO_CLOUD_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          cargo test --locked --release --target "${{ matrix.target }}" \
            command_uses_contained_cwd_literal_argv_and_isolates_parent_environment \
            -- --nocapture
      - name: Verify release identity
        shell: bash
        env:
          EXPECTED_SOURCE_REVISION: ${{ needs.verify_release.outputs.source_revision }}
          EXPECTED_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/scherzo-cloud"
          test "$("$binary" --version)" = "scherzo-cloud $EXPECTED_VERSION"
          version_json=$("$binary" version --json)
          python3 - "$version_json" "$EXPECTED_VERSION" "$EXPECTED_SOURCE_REVISION" <<'PY'
          import json
          import sys

          document = json.loads(sys.argv[1])
          expected = {
              "schemaVersion": 1,
              "command": "scherzo-cloud",
              "version": sys.argv[2],
              "buildIdentity": sys.argv[3],
          }
          for key, value in expected.items():
              if document.get(key) != value:
                  raise SystemExit(f"unexpected {key}: {document.get(key)!r}; expected {value!r}")
          if not document.get("executablePath"):
              raise SystemExit("release binary reported an empty executablePath")
          PY
      - name: Package and verify deterministic release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          release_dist="$RUNNER_TEMP/scherzo-release-dist"
          test ! -e "$release_dist"
          archive=$(
            ./scripts/package-release-archive \
              --binary "target/$TARGET/release/scherzo-cloud" \
              --output "$release_dist" \
              --target "$TARGET" \
              --version "$VERSION"
          )
          ./scripts/verify-release-package-isolated \
            --archive "$archive" \
            --target "$TARGET" \
            --version "$VERSION"
          mkdir -p dist
          cp "$archive" dist/
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  reconcile_release:
    name: Reconcile ${{ needs.verify_release.outputs.tag }}
    if: >-
      needs.verify_release.outputs.execute == 'true' &&
      needs.verify_release.outputs.complete == 'false'
    needs:
      - verify_release
      - build_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Fetch managed release records
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main \
            '+refs/heads/release-allocations/*:refs/heads/release-allocations/*' \
            '+refs/heads/release-recoveries/*:refs/heads/release-recoveries/*'
          git fetch --force --tags origin
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create exact checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("dist")
          archives = sorted(root.glob("*.tar.gz"), key=lambda path: os.fsencode(path.name))
          if len(archives) != 3:
              raise SystemExit(f"expected three native archives, found {len(archives)}")
          lines = []
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              lines.append(f"{digest}  {archive.name}\n")
          (root / "SHA256SUMS").write_text("".join(lines), encoding="ascii")
          PY
      - name: Inspect exact reconciliation
        shell: bash
        env:
          ALLOCATED_MIRROR: ${{ needs.verify_release.outputs.allocated_mirror }}
          DISPATCHED_ALLOCATION: ${{ inputs.allocated_mirror }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event=push
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            event=recovery
            test "$DISPATCHED_ALLOCATION" = "$ALLOCATED_MIRROR"
          fi
          ./scripts/reconcile-release inspect \
            --repository . \
            --allocated-mirror "$ALLOCATED_MIRROR" \
            --workflow-commit "$GITHUB_SHA" \
            --event "$event" \
            --github-repository "$GITHUB_REPOSITORY" \
            --dist dist
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Reconcile exact GitHub Release
        shell: bash
        env:
          ALLOCATED_MIRROR: ${{ needs.verify_release.outputs.allocated_mirror }}
          DISPATCHED_ALLOCATION: ${{ inputs.allocated_mirror }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event=push
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            event=recovery
            test "$DISPATCHED_ALLOCATION" = "$ALLOCATED_MIRROR"
          fi
          ./scripts/reconcile-release apply \
            --repository . \
            --allocated-mirror "$ALLOCATED_MIRROR" \
            --workflow-commit "$GITHUB_SHA" \
            --event "$event" \
            --github-repository "$GITHUB_REPOSITORY" \
            --dist dist
