schemaVersion: 1
inputs:
  request:
    kind: text
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  build:
    kind: agent
    agent:
      profile: coding
      systemPrompt: system.md
      message:
        text:
          - ref: inputs.request
    outputs:
      result:
        kind: json
        from: agent_result
        schema: result.schema.json
