schemaVersion: 1
agentProfiles:
  repair:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  handlerless:
    kind: cmd
    recovery:
      retries: 1
    command:
      argv: ["true"]
  commandRepair:
    kind: cmd
    recovery:
      retries: 2
      handler:
        kind: cmd
        cwd: repair
        command:
          argv: ["./repair", "--generated"]
    command:
      argv: ["true"]
  agentRepair:
    kind: agent
    recovery:
      retries: 10
      handler:
        kind: agent
        profile: repair
        prompt: prompts/recovery.md
        cwd: repair
    agent:
      profile: repair
      systemPrompt: prompts/system.md
      message:
        text:
          - file: prompts/message.md
