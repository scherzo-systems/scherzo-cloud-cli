schemaVersion: 1
agentProfiles:
  piCoding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
  claudeCoding:
    harness:
      kind: claude_code
      config:
        model: claude-opus-4-1
        effort: xhigh
  codexCoding:
    harness:
      kind: codex
      config:
        model: gpt-5.4
        effort: xhigh
steps:
  plan:
    kind: agent
    agent:
      profile: piCoding
      systemPrompt: prompts/plan-system.md
      message:
        text:
          - file: prompts/plan-message.md
    outputs:
      response:
        kind: text
        from: agent_response
  implement:
    kind: agent
    dependsOn: [plan]
    agent:
      profile: claudeCoding
      systemPrompt: prompts/implement-system.md
      message:
        text:
          - ref: outputs.plan.response
    outputs:
      response:
        kind: text
        from: agent_response
  review:
    kind: agent
    dependsOn: [implement]
    agent:
      profile: codexCoding
      systemPrompt: prompts/review-system.md
      message:
        text:
          - ref: outputs.implement.response
    outputs:
      response:
        kind: text
        from: agent_response
exports:
  response:
    ref: outputs.review.response
