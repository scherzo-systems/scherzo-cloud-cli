schemaVersion: 1
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  produce:
    kind: agent
    agent:
      profile: coding
      systemPrompt: prompts/system.md
      message:
        text: [{ file: prompts/message.md }]
    outputs:
      response:
        kind: agent_response
