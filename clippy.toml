# Compile-time environment reads must remain behind an explicit boundary so
# packaged build metadata cannot be bypassed accidentally. Production code
# reads the resolved version through build_info::VERSION; narrow exceptions
# document the canonical fallback and Cargo-provided test fixtures.
disallowed-macros = [
  { path = "std::env", reason = "use the explicit compile-time environment boundary" },
]

# Timing primitives are denied by default across every CLI target. Production
# clock and deadline operations pass through explicit system adapters; narrow
# anti-hang watchdog exceptions remain documented next to their direct calls.
disallowed-methods = [
  { path = "std::thread::park_timeout", reason = "use explicit synchronization rather than a park timeout" },
  { path = "std::thread::park_timeout_ms", reason = "use explicit synchronization rather than a park timeout", allow-invalid = true },
  { path = "std::thread::sleep", reason = "use the module's timing abstraction" },
  { path = "std::thread::yield_now", reason = "use explicit synchronization rather than scheduler yielding" },
  { path = "std::time::Instant::elapsed", reason = "use the module's timing abstraction" },
  { path = "std::time::Instant::now", reason = "use the module's timing abstraction" },
  { path = "std::time::SystemTime::now", reason = "use the module's clock abstraction" },
  { path = "time::OffsetDateTime::now_utc", reason = "use the module's clock abstraction" },
  { path = "tokio::task::yield_now", reason = "use explicit synchronization rather than scheduler yielding" },
  { path = "tokio::time::Instant::now", reason = "use the module's timing abstraction" },
  { path = "tokio::time::advance", reason = "release controlled timing instead", allow-invalid = true },
  { path = "tokio::time::interval", reason = "use the module's timing abstraction" },
  { path = "tokio::time::interval_at", reason = "use the module's timing abstraction" },
  { path = "tokio::time::pause", reason = "release controlled timing instead", allow-invalid = true },
  { path = "tokio::time::resume", reason = "release controlled timing instead", allow-invalid = true },
  { path = "tokio::time::sleep", reason = "use the module's timing abstraction" },
  { path = "tokio::time::sleep_until", reason = "use the module's timing abstraction" },
  { path = "tokio::time::timeout", reason = "use controlled timing or an anti-hang watchdog" },
  { path = "tokio::time::timeout_at", reason = "use controlled timing or an anti-hang watchdog" },
]
