# yaml-language-server: $schema=../../schemas/workflow-v1.schema.json
schemaVersion: 1

description: Ask a low-effort Claude Code agent to combine a static brief with imported instructions and updates.

agentProfiles:
  haiku:
    harness:
      kind: claude_code
      config:
        model: claude-haiku-4-5-20251001
        effort: low

steps:
  summarize:
    kind: agent
    agent:
      profile: haiku
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/claude-attachment-question.md
          - ref: imports.prompt
        attachments:
          - file: attachments/aurora-brief.txt
          - ref: imports.attachments
    outputs:
      response:
        kind: text
        from: agent_response

exports:
  response:
    ref: outputs.summarize.response
