# yaml-language-server: $schema=../../schemas/workflow-v1.schema.json
schemaVersion: 1

description: Ask a low-thinking Luna agent a basic arithmetic question.

agentProfiles:
  basic:
    harness:
      kind: pi
      config:
        model: openai-codex/gpt-5.6-luna
        thinking: low

steps:
  answer:
    kind: agent
    agent:
      profile: basic
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/basic-agent-question.md
    outputs:
      response:
        kind: agent_response

exports:
  response:
    ref: outputs.answer.response
