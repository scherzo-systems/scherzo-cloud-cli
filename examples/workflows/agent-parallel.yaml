# yaml-language-server: $schema=../../schemas/workflow-v1.schema.json
schemaVersion: 1

description: Run three small agents concurrently and combine their responses.

agentProfiles:
  luna:
    harness:
      kind: pi
      config:
        model: openai-codex/gpt-5.6-luna
        thinking: low

steps:
  alpha:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/parallel-alpha.md
    outputs:
      response:
        kind: agent_response

  beta:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/parallel-beta.md
    outputs:
      response:
        kind: agent_response

  gamma:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/parallel-gamma.md
    outputs:
      response:
        kind: agent_response

  combine:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/basic-agent-system.md
      message:
        text:
          - file: prompts/parallel-combine.md
          - ref: outputs.alpha.response
          - ref: outputs.beta.response
          - ref: outputs.gamma.response
    outputs:
      response:
        kind: agent_response

exports:
  response:
    ref: outputs.combine.response
