# yaml-language-server: $schema=../../schemas/workflow-v1.schema.json
schemaVersion: 1

description: Exercise structured-result rejection with an unsatisfiable result schema.

agentProfiles:
  luna:
    harness:
      kind: pi
      config:
        model: openai-codex/gpt-5.6-luna
        thinking: low

steps:
  impossibleResult:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/invalid-result-system.md
      message:
        text:
          - file: prompts/invalid-result.md
    outputs:
      result:
        kind: json
        from: agent_result
        schema: schemas/impossible-result.schema.json

exports:
  result:
    ref: outputs.impossibleResult.result
