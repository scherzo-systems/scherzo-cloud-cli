# yaml-language-server: $schema=../../schemas/workflow-v1.schema.json
schemaVersion: 1

description: Cancel a long-running agent tool call and run a cancellation-only finalizer.

agentProfiles:
  luna:
    harness:
      kind: pi
      config:
        model: openai-codex/gpt-5.6-luna
        thinking: low

steps:
  wait:
    kind: agent
    agent:
      profile: luna
      systemPrompt: prompts/slow-cancel-system.md
      message:
        text:
          - file: prompts/slow-cancel.md
    outputs:
      response:
        kind: text
        from: agent_response

finalizers:
  cancellationReport:
    kind: cmd
    when: [cancelled]
    command:
      argv:
        - sh
        - -c
        - "set -eu; printf '%s\\n' 'cancellation-only finalizer ran'"

exports:
  response:
    ref: outputs.wait.response
