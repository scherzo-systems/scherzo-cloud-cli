[package]
name = "scherzo-cloud"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.97"
description = "Command-line interface and runner for Scherzo Cloud"
license = "Apache-2.0"
repository = "https://github.com/scherzo-systems/scherzo-cloud-cli"
publish = false

[workspace]
members = [
  ".",
  "crates/api",
  "crates/runner-protocol",
  "crates/support",
  "crates/test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/scherzo-systems/scherzo-cloud-cli"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
warnings = "deny"

[workspace.lints.clippy]
# `forbid` conflicts with group-level allows emitted by Clap derives.
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
disallowed_methods = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.3", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
fs4 = "1.1.0"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
http-body-util = "0.1.4"
hyper = { version = "1.8.1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "rustls-platform-verifier", "tls12"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
jsonschema = { version = "0.49.2", default-features = false }
libc = "0.2.189"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
prost = "0.14"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "query", "rustls-no-provider"] }
regress = "0.10.4"
ring = "0.17.14"
rustix = { version = "1.1.4", features = ["fs", "net", "process", "termios"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
scherzo-cloud-api = { path = "crates/api" }
scherzo-cloud-runner-protocol = { path = "crates/runner-protocol" }
scherzo-cloud-support = { path = "crates/support" }
scherzo-cloud-test-support = { path = "crates/test-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "unbounded_depth"] }
tempfile = "3.27.0"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
trycmd = "1.2.1"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
yaml-rust2 = { version = "0.11.0", default-features = false }
zeroize = "1.9.0"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
flate2.workspace = true
fs4.workspace = true
futures-util.workspace = true
getrandom.workspace = true
jsonschema.workspace = true
libc.workspace = true
nix.workspace = true
opentelemetry.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk.workspace = true
prost.workspace = true
ratatui.workspace = true
reqwest.workspace = true
ring.workspace = true
rustix.workspace = true
scherzo-cloud-api.workspace = true
scherzo-cloud-runner-protocol.workspace = true
scherzo-cloud-support.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
ulid.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
yaml-rust2.workspace = true
zeroize.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["event", "pty"] }
scherzo-cloud-test-support.workspace = true
trycmd.workspace = true
tokio = { workspace = true, features = ["sync"] }
