[package]
name = "scherzo-cloud"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line interface and runner for Scherzo Cloud"
license = "Apache-2.0"
repository = "https://github.com/scherzo-systems/scherzo-cloud-cli"
publish = false

[workspace]
members = ["."]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
warnings = "deny"

[lints.clippy]
# `forbid` conflicts with group-level allows emitted by Clap derives.
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
ctrlc = "3.5.1"
fs4 = "1.1.0"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "query", "rustls-no-provider"] }
regress = "=0.10.4"
rustix = { version = "1.1.4", features = ["fs", "process"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ulid = "3.0.0"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["sync"] }
