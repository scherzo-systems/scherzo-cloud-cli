schemaVersion: 1
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  build:
    kind: agent
    agent:
      profile: coding
      systemPrompt: system.md
      message:
        text:
          - ref: imports.prompt
    outputs:
      result:
        kind: json
        from: agent_result
        schema: result.schema.json
