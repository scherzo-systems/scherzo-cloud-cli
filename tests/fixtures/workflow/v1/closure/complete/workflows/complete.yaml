schemaVersion: 1
description: Shared Cloud and Runner source-closure fixture.
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: xhigh
steps:
  agent:
    kind: agent
    recovery:
      retries: 2
      handler:
        kind: agent
        profile: coding
        prompt: ../prompts/recovery.md
        cwd: repairs
    agent:
      profile: coding
      systemPrompt: ../prompts/system.md
      message:
        text:
          - file: ../prompts/message.md
          - ref: imports.prompt
          - file: ../prompts/message.md
        attachments:
          - file: ../attachments/data.bin
    outputs:
      result:
        kind: agent_result
        schema: ../schemas/result.schema.json
finalizers:
  report:
    kind: agent
    agent:
      profile: coding
      systemPrompt: ../prompts/finalizer-system.md
      message:
        text:
          - file: ../prompts/finalizer-message.md
        attachments:
          - file: ../attachments/finalizer.bin
    outputs:
      result:
        kind: agent_result
        schema: ../schemas/finalizer.schema.json
exports:
  result:
    ref: outputs.agent.result
