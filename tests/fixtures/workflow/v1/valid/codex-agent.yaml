schemaVersion: 1
agentProfiles:
  coding:
    harness:
      kind: codex
      config:
        model: gpt-5.4
        effort: xhigh
steps:
  implement:
    kind: agent
    agent:
      profile: coding
      systemPrompt: prompts/implement-system.md
      message:
        text:
          - file: prompts/implement-message.md
    outputs:
      response:
        kind: text
        from: agent_response
exports:
  response:
    ref: outputs.implement.response
