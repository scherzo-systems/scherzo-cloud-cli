schemaVersion: 1
description: Plan, implement, test, and export a requested change.

agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high

steps:
  prepare:
    kind: cmd
    command:
      argv: ["./scripts/prepare-workspace.sh"]

  plan:
    kind: agent
    dependsOn: [prepare]
    agent:
      profile: coding
      systemPrompt: prompts/plan-system.md
      message:
        text:
          - ref: imports.prompt
        attachments:
          - ref: imports.attachments
    outputs:
      plan:
        kind: agent_result
        schema: schemas/change-plan.schema.json
      artifact:
        kind: file
        path: artifacts/plan.txt
        mediaType: text/plain

  implement:
    kind: agent
    agent:
      profile: coding
      systemPrompt: prompts/implement-system.md
      message:
        text:
          - file: prompts/implement-message.md
          - ref: imports.prompt
        attachments:
          - ref: imports.attachments
          - ref: outputs.plan.plan
          - ref: outputs.plan.artifact
    outputs:
      response:
        kind: agent_response

  test:
    kind: cmd
    cwd: packages/api
    inputs:
      prompt:
        ref: imports.prompt
      changeSummary:
        ref: outputs.implement.response
    command:
      argv: ["./scripts/test.sh"]
    outputs:
      report:
        kind: file
        path: packages/api/artifacts/test-report.xml
        mediaType: application/junit+xml

exports:
  response:
    ref: outputs.implement.response
  testReport:
    ref: outputs.test.report
